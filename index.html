<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MT-byte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MT-byte</title>
<style>
:root{
  --bg:#121212; --elev:#181818; --surface:#242424; --hover:#2a2a2a; --line:#2a2a2a; --text:#ffffff; --muted:#a7a7a7; --dim:#727272;
  --accent:#ff6a13; --ink:#000000; --err:#ff4d5e; --soft:#ffd23f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121212; --elev:#181818; --surface:#242424; --text:#ffffff; --muted:#a7a7a7; } }
:root[data-theme="dark"]{ --bg:#121212; --elev:#181818; --surface:#242424; --text:#ffffff; --muted:#a7a7a7; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:linear-gradient(180deg,#3a2213 0,var(--bg) 260px) no-repeat,var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:12px 16px 130px}
h1{font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:22px 0 6px}
h2{font-weight:700;font-size:21px;letter-spacing:-.02em;margin:30px 0 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.primary{display:block;width:100%;background:var(--accent);color:var(--ink);font-weight:700;padding:16px;margin:8px 0;border-radius:500px;font-size:16px}
.secondary{display:block;width:100%;background:transparent;border:1px solid var(--dim);color:var(--text);padding:14px;margin:8px 0;font-weight:700;border-radius:500px}
.ghost{color:var(--muted);padding:12px 0;font-weight:600;font-size:14px}
.danger{color:var(--err);padding:16px 0;font-weight:700;display:block;margin:8px auto 0}
.note{color:var(--muted);font-size:14px}
.warn{color:var(--err);font-size:14px;font-weight:600}
.acc{color:var(--err)}
.hi{color:var(--text);font-weight:600}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:17px}
.top button{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;flex:0 0 36px}
.off{font-size:12px;font-weight:700;color:var(--ink);background:var(--soft);border-radius:500px;padding:3px 10px;display:inline-block}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 0}
.tabs button{padding:9px 2px;background:var(--surface);color:var(--text);font-size:12px;font-weight:600;border-radius:500px}
.tabs button.cur{background:var(--accent);color:var(--ink);font-weight:700}
.tabs button.done:not(.cur)::after{content:" ✓";color:var(--accent)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 6px}
.hero h1{margin:0}
.count{color:var(--muted);font-size:14px;margin:0 0 18px}
.job{display:flex;align-items:center;width:100%;text-align:left;padding:8px;margin:0 -8px;width:calc(100% + 16px);border-radius:6px;gap:12px}
.job:active{background:var(--hover)}
.job>div{flex:1;min-width:0}
.job b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job>div>span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{flex:0 0 52px;height:52px;border-radius:4px;display:grid;place-items:center;background:linear-gradient(135deg,#3a3a3a,#1c1c1c);color:var(--muted)}
.cover.s-pågår{background:linear-gradient(135deg,#ff8a3d,#b8420a);color:var(--ink)}
.cover.s-klar{background:linear-gradient(135deg,#4a4a4a,#262626);color:var(--accent)}
.cover svg.i{width:24px;height:24px;stroke-width:1.8}
.tag{font-size:12px;font-weight:700;color:var(--muted);flex:0 0 auto}
.tag.on{color:var(--accent)}
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid transparent;border-radius:6px;font:inherit;font-weight:500;font-size:17px;padding:13px 14px;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--text)}
input::placeholder{color:var(--dim)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.regs small{display:block;font-size:13px;margin-top:6px;color:var(--muted)}
.regs small.acc{color:var(--err)}
.stamp{display:flex;justify-content:space-between;align-items:center;background:var(--elev);padding:14px 16px;margin-bottom:8px;border-radius:8px}
.stamp .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stamp button{color:var(--ink);background:var(--text);font-weight:700;font-size:14px;padding:8px 16px;border-radius:500px}
.big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:14px 0 4px}
.check{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);font-weight:500}
.box{flex:0 0 26px;height:26px;border:2px solid var(--dim);border-radius:50%;display:grid;place-items:center}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check.on .box::after{content:"";width:10px;height:5px;border:2.5px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.k2w{border-bottom:1px solid var(--line)}
.k2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0}
.k2t{flex:1;min-width:0}
.k2t>b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.k2 small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.k2 small.hi{color:var(--text)}
.k2.was .k2t>b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:8px;vertical-align:1px}
.tick{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;transition:background .15s,border-color .15s}
.k2.ok .tick{background:var(--accent);border-color:var(--accent)}
.k2.ok .tick::after{content:"";width:11px;height:6px;border:2.5px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.k2.fel .tick{background:var(--err);border-color:var(--err)}
.k2.fel .tick::after{content:"✕";color:var(--ink);font-weight:800;font-size:14px;line-height:1}
.k2.fel .k2t>b{color:var(--err)}
.fnote{margin:0 0 14px;font-size:15px;padding:11px 12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:6px}
.photos button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;width:30px;height:30px;border-radius:50%}
.camera{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:var(--elev);border-radius:8px;margin:4px 0 20px;cursor:pointer;font-weight:600}
.camera input{display:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
details{margin:20px 0;background:var(--elev);padding:14px 16px;border-radius:8px}
summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
td,th{padding:10px 6px 10px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-size:12px;font-weight:600}
tr.sel td{color:var(--accent);font-weight:600}
.sum{background:var(--elev);padding:16px;margin:12px 0;border-radius:8px}
.sum p{margin:6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(18,18,18,0),var(--bg) 35%);padding:28px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .primary{max-width:528px;margin:0 auto}
#status{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--ink);background:var(--text);border-radius:500px;padding:6px 14px;pointer-events:none;transition:opacity .3s;opacity:0;z-index:5}
.empty{padding:36px 0;color:var(--muted)}
.menu{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.mbtn,.menu button{background:var(--surface);color:var(--text);padding:8px 14px;border-radius:500px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px;font-weight:600}
.mbtn svg.i,.menu button svg.i{width:18px;height:18px}
.soft{color:var(--soft);font-size:14px}
.mid{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.order{background:linear-gradient(135deg,#5a2a0e,var(--elev) 70%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
</style>
</head>
<body>
<div id="status"></div>
<main id="app"><p class="empty">Startar…</p></main>
<script>
/* ================= Data från Öresundskrafts blad ================= */
const TABS = ['Förbered','Före','Byte','Efter','Klart'];
const FAS = ['L1','L2','L3'], PLATS = ['Mätfack','Kopplingsplint','Mätaren'];
const K2 = [
  {id:'p1', t:'Strömtransformatorer P1 → P2, P1 mot nät', c:FAS},
  {id:'s_trafo', t:'Strömriktning S1 → S2 vid strömtransformatorer', h:'S1: två blå kablar. En till PE/PEN, en till undersida kopplingsplint LxJI.', c:FAS},
  {id:'s_plint', t:'Strömriktning S1 → S2 vid kortslutningsplint', h:'Följ kabeln från S1 till LxJI. S2 till undersida kopplingsplint LxI.', c:FAS},
  {id:'s_matare', t:'Strömriktning S1 → S2 vid mätaren', h:'Följ kabeln från plintens inkommande sida till mätaren. Kolla riktningsändring och fasväxling.', c:FAS},
  {id:'f_fack', t:'Ström- och spänningskrets samma fas vid mätfack', c:FAS},
  {id:'f_plint', t:'Ström- och spänningskrets samma fas vid kortslutningsplint', c:FAS},
  {id:'f_matare', t:'Ström- och spänningskrets samma fas vid mätaren', c:FAS},
  {id:'konstant', t:'Omsättning i mätaren/systemet stämmer med trafon', c:['OK']},
  {id:'hel_trafo', t:'Strömkrets inte kortsluten eller bruten vid trafo', c:FAS},
  {id:'hel_prov', t:'Strömkrets inte kortsluten eller bruten vid provplint', c:FAS},
  {id:'spanning', t:'Spänningskrets hel L1–L3', h:'Säkringar hela, 10 A diazed. Spänningskrets sluten i kortslutningsplint.', c:['OK']},
  {id:'skruv', t:'Känn över alla åtkomliga plintskruvar', c:PLATS},
  {id:'plomb', t:'Plomberingar', c:PLATS},
  {id:'splen', t:'Förbindelseledning huvudledning–spänningssäkring max 0,5 m', c:['OK']},
  {id:'diazed', t:'Spänningssäkring 10 A typ Diazed', c:['OK']}
];
const K2N = K2.length;
const SAFE = ['Sekundärkretsar kortslutna i provplint före arbete','Spänningslöshet kontrollerad på primärsidan'];
const REGS = [
  {k:'r1',o:'1.8.0',t:'Aktiv uttag',u:'kWh'},
  {k:'r2',o:'2.8.0',t:'Aktiv inmatning',u:'kWh'},
  {k:'r3',o:'3.8.0',t:'Reaktiv uttag',u:'kvarh'},
  {k:'r4',o:'4.8.0',t:'Reaktiv inmatning',u:'kvarh'}
];
const AREAS = [['2,5',0.35],['4',0.22],['6',0.15],['10',0.09]];
const VAM = Object.fromEntries(AREAS);
const SAKR = ['','16','20','25','35','50','63','80','100','125','160','200','250','315','400','500','630','800','1000'];
const ICON = {
  imp:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  cam:'<svg class="i" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  calc:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>',
  mt:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>'
};

/* ================= Lagring (IndexedDB) ================= */
let DB, jobs=[], photoUrls={}, photoMeta=[];
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('mtbyte',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('jobs',{keyPath:'id'}); d.createObjectStore('photos',{keyPath:'id'}).createIndex('job','jobId'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{ const t=DB.transaction(store,mode); const q=fn(t.objectStore(store)); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
}
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const photosOf=id=>tx('photos','readonly',o=>o.index('job').getAll(id));

let saveT;
function save(j=job()){
  if(j.status==='planerad') j.status='pågår';
  clearTimeout(saveT);
  saveT=setTimeout(()=>dbPut('jobs',j).then(()=>flash('Sparat')).catch(()=>flash('Kunde inte spara. Telefonens lagring kan vara full.')),250);
}

/* ================= Hjälpare ================= */
let st={view:'list'};
const $app=document.getElementById('app');
function job(){ return jobs.find(j=>j.id===st.id); }
function flash(t){ const s=document.getElementById('status'); s.textContent=t; s.style.opacity=1; clearTimeout(flash.t); flash.t=setTimeout(()=>s.style.opacity=0,1200); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function get(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k],o); }
function set(o,p,v){ const k=p.split('.'); let a=o; k.slice(0,-1).forEach(x=>{ if(a[x]==null) a[x]={}; a=a[x]; }); a[k.at(-1)]=v; }
function num(v){ const n=parseFloat(String(v??'').replace(',','.').replace(/\s/g,'')); return isFinite(n)?n:null; }
function ratio(s){ const m=String(s||'').match(/([\d.,]+)\s*\/\s*([\d.,]+)/); if(!m) return null; const a=num(m[1]),b=num(m[2]); return a&&b?a/b:null; }
function dec(n,d=1){ return n==null?'—':n.toLocaleString('sv-SE',{maximumFractionDigits:d,minimumFractionDigits:d}); }
function fmtT(iso){ return iso?new Date(iso).toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'}):'—'; }
function fmtDT(iso){ return new Date(iso).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}); }
/* En bock per uppgift. Äldre byten med bock per fas läses om automatiskt. */
function kv(k,r){ k=k||{}; if(k[r.id]) return k[r.id];
  const v=r.c.map(c=>k[r.id+'.'+c]); if(v.some(x=>x==='fel')) return 'fel'; if(v.length&&v.every(x=>x==='ok')) return 'ok'; return undefined; }
function kc(j,ph,okOnly){ const k=j.kontroll[ph]||{}; return K2.filter(r=>{ const v=kv(k,r); return okOnly?v==='ok':!!v; }).length; }
function kfel(j,ph){ const k=j.kontroll[ph]||{}; return K2.filter(r=>kv(k,r)==='fel').map(r=>({r,f:r.c.filter(c=>k[r.id+'.'+c]==='fel')})); }
function ratioChanged(j){ const o=ratio(j.fore.ratio), n=ratio(j.byte.ratio); return o&&n&&Math.abs(o-n)>1e-9; }
function prim(s){ const m=String(s||'').match(/(\d+)\s*\//); return m?+m[1]:null; }
function stripNr(s){ return String(s||'').replace(/[^\dA-Za-z]/g,''); }
function sakWarn(j,which){
  const s=num(j.fore.sakring), out=[];
  if(!s) return '';
  if(which==='fore'){
    const x=j.order&&j.order.xlnt; if(x&&x!==s) out.push(`Systemet (XLNT) anger ${x} A, på plats sitter ${s} A. Notera avvikelsen.`);
    const p=prim(j.fore.ratio); if(p&&p<s) out.push(`Gammal trafo ${esc(j.fore.ratio)} har primärström under säkringen ${s} A. Kontrollera.`);
  } else {
    const p=prim(j.byte.ratio); if(p&&p<s) out.push(`Ny trafo ${esc(j.byte.ratio)} har primärström under säkringen ${s} A. Kontrollera.`);
  }
  return out.map(t=>`<p class="soft">${t}</p>`).join('');
}
function orderWarn(j){
  const o=j.order&&j.order.newRatio; if(!o||!j.byte.ratio) return '';
  return ratio(o)!==ratio(j.byte.ratio)?`<p class="warn">Ordern säger ${esc(o)}, du har skrivit ${esc(j.byte.ratio)}.</p>`:'<p class="note">Stämmer med ordern.</p>';
}
function tabDone(j,i){
  return [
    ()=>{ const fb=j.forberedelse; return !!(fb&&(fb.kontakt||fb.telefon||fb.viktigt||fb.notering)); },
    ()=>j.fore.ean && j.fore.r1 && kc(j,'fore')===K2N,
    ()=>j.byte.slut && j.byte.ratio && SAFE.every((_,x)=>j.byte.safe[x]),
    ()=>j.efter.r1 && kc(j,'efter',true)===K2N,
    ()=>j.status==='klar'
  ][i]();
}

/* ================= Formulärdelar ================= */
function f(label,p,o={}){
  return `<label class="f"><span>${label}</span><input data-k="${p}" value="${esc(get(job(),p))}" ${o.im?`inputmode="${o.im}"`:''} ${o.ph?`placeholder="${o.ph}"`:''} autocomplete="off"></label>`;
}
function sel(label,p,opts){
  const v=get(job(),p);
  return `<label class="f"><span>${label}</span><select data-k="${p}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></label>`;
}
function photos(step,label){
  const list=photoMeta.filter(p=>p.step===step);
  return `<div class="photos">${list.map(p=>`<figure><img src="${photoUrls[p.id]}" alt="Foto ${esc(step)}"><button data-act="delphoto" data-id="${p.id}" aria-label="Ta bort foto">×</button></figure>`).join('')}</div>
  <label class="camera">${ICON.cam}<span>${label}</span><input type="file" accept="image/*" capture="environment" data-photo="${step}"></label>`;
}
function regFields(ph){
  const j=job();
  return `<div class="regs">${REGS.map(r=>{
    const fv=num(j.fore[r.k]), ev=num(j[ph][r.k]), d=ph==='efter'&&!j.byte.bytt&&fv!=null&&ev!=null?ev-fv:null;
    return `<label class="f"><span>${r.o} ${r.t}, ${r.u}</span><input data-k="${ph}.${r.k}" value="${esc(j[ph][r.k])}" inputmode="decimal" autocomplete="off">
    ${ph==='efter'?`<small id="d-${r.k}" class="${d!=null&&d<0?'acc':''}">${diffText(d,r.u)}</small>`:''}</label>`;
  }).join('')}</div>`;
}
function diffText(d,u){ return d==null?'':d<0?`Lägre än före (${dec(d,1)} ${u}). Kontrollera avläsningen.`:`+${dec(d,1)} ${u} sedan före`; }
function checklist(j,ph){
  const k=j.kontroll[ph]||{}, notes=j.kontroll.note[ph]||{}, was=ph==='efter'?(j.kontroll.fore||{}):{};
  return K2.map(r=>{
    const v=kv(k,r), wasFel=kv(was,r)==='fel';
    let info='';
    if(r.id==='konstant'){
      const rs=ph==='fore'?j.fore.ratio:j.byte.ratio;

function copyText(t,cells){
  const html=cells?'<table><tr>'+cells.map(c=>'<td style="mso-number-format:\'\\@\'">'+esc(c)+'</td>').join('')+'</tr></table>':null;
  const onCopy=e=>{ e.clipboardData.setData('text/plain',t); if(html) e.clipboardData.setData('text/html',html); e.preventDefault(); };
  document.addEventListener('copy',onCopy);
  const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.setSelectionRange(0,t.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); document.removeEventListener('copy',onCopy); return ok;
}

function parseCSV(text){
  const first=text.split(/\r?\n/)[0], d=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[]; let row=[], fld='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ fld+='"'; i++; } else q=false; } else fld+=c; }
    else if(c==='"') q=true;
    else if(c===d){ row.push(fld); fld=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(fld); rows.push(row); row=[]; fld=''; }
    else fld+=c;
  }
  if(fld||row.length){ row.push(fld); rows.push(row); }
  return rows;
}
async function readText(file){
  const buf=await file.arrayBuffer();
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,''); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
/* Läser .xlsx direkt i telefonen, utan bibliotek och utan nät */
async function unzipEntries(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf); let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error('Inte en xlsx-fil');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), size=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    out[name]={method,data:u8.subarray(start,start+size)};
    p+=46+nl+xl+cl;
  }
  return out;
}
async function unzipText(z,name){
  const f=z[name]; if(!f) return null;
  if(f.method===0) return new TextDecoder().decode(f.data);
  const s=new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(s).text();
}

  const z=await unzipEntries(await file.arrayBuffer()), P=t=>new DOMParser().parseFromString(t,'application/xml');
  const sst=[]; const ss=await unzipText(z,'xl/sharedStrings.xml');
  if(ss) for(const si of P(ss).getElementsByTagName('si')) sst.push([...si.getElementsByTagName('t')].filter(t=>t.parentNode.nodeName!=='rPh').map(t=>t.textContent).join(''));
  const rel={}; const rx=await unzipText(z,'xl/_rels/workbook.xml.rels');
  if(rx) for(const r of P(rx).getElementsByTagName('Relationship')){ const t=r.getAttribute('Target'); rel[r.getAttribute('Id')]=t.startsWith('/')?t.slice(1):'xl/'+t; }
  const wb=P(await unzipText(z,'xl/workbook.xml'));
  let paths=[...wb.getElementsByTagName('sheet')].map(s=>rel[s.getAttribute('r:id')]);
  /* Läs först bladet som var öppet när filen sparades, sedan resten */
  const wv=wb.getElementsByTagName('workbookView')[0], act=wv?+(wv.getAttribute('activeTab')||0):0;
  if(paths[act]) paths=[paths[act],...paths.filter((_,i)=>i!==act)];
  paths=paths.filter(Boolean);
  const colIdx=ref=>{ let n=0; for(const ch of ref.replace(/\d+/g,'')) n=n*26+ch.charCodeAt(0)-64; return n-1; };
  const sheets=[];
  for(const path of paths){
    const x=await unzipText(z,path); if(!x) continue;
    const rows=[];
    for(const row of P(x).getElementsByTagName('row')){
      const arr=[];
      for(const c of row.getElementsByTagName('c')){
        const t=c.getAttribute('t'), vEl=c.getElementsByTagName('v')[0]; let val='';
        if(t==='s') val=vEl?sst[+vEl.textContent]??'':'';
        else if(t==='inlineStr') val=[...c.getElementsByTagName('t')].map(e=>e.textContent).join('');
        else val=vEl?vEl.textContent:'';
        arr[c.getAttribute('r')?colIdx(c.getAttribute('r')):arr.length]=val;
      }
      rows[row.getAttribute('r')?(+row.getAttribute('r')-1):rows.length]=Array.from(arr,v=>v??'');
    }
    sheets.push(Array.from(rows,r=>r||[]));
  }
  return sheets;
}
function headerAt(rows){
  for(let i=0;i<Math.min(rows.length,15);i++) if((rows[i]||[]).some(x=>String(x).trim().toLowerCase()==='ean')) return i;
  return -1;
}
async function importOrders(file){
  if(/\.xls$/i.test(file.name)){ alert('Gammalt Excel-format (.xls). Spara som .xlsx eller CSV UTF-8 och försök igen.'); return; }
  let rows;
  if(/\.xlsx$/i.test(file.name)){
    const sheets=await readXlsx(file);
    rows=sheets.find(r=>headerAt(r)>=0)||sheets[0]||[];
  } else rows=parseCSV(await readText(file));
  const hi=Math.max(0,headerAt(rows)); rows=rows.slice(hi);
  const h=(rows[0]||[]).map(x=>String(x).trim().toLowerCase());
  const col=fn=>h.findIndex(fn);
  const C={ ao:col(x=>x==='arbetsorder'), ean:col(x=>x==='ean'), adr:col(x=>x==='adress'), xlnt:col(x=>x.startsWith('xlnt')),
    upp:col(x=>x==='kommentar ökab'), nyc:col(x=>x==='nyckel'), ant:col(x=>x==='kommentar ökab/liro'),
    mnr:col(x=>x.startsWith('gammal mätarnummer')), pl:col(x=>x.startsWith('plint')), plc:col(x=>x.startsWith('placering')),
    utf:col(x=>x.startsWith('utfört')), stat:col(x=>x==='status'), stopA:col(x=>x.startsWith('stoppställning a+')) };
  if(C.ean<0){ alert('Hittar ingen kolumn som heter EAN. Är det rätt fil?'); return; }
  const v=(r,i)=>i<0?'':String(r[i]??'').trim();
  let added=0, done=0, dup=0;
  for(const r of rows.slice(1)){
    const ean=stripNr(v(r,C.ean)); if(!ean) continue;
    if(v(r,C.utf)||v(r,C.stopA)||/^ok$/i.test(v(r,C.stat))){ done++; continue; }
    const ao=v(r,C.ao);
    if(jobs.some(x=>(ao&&x.order&&x.order.ao===ao)||(!ao&&x.fore.ean===ean))){ dup++; continue; }
    const upp=v(r,C.upp), m=upp.match(/(\d+)\s*\/\s*5[^>]*?->\s*([A-Za-z][A-Za-z0-9]*)?\s*(\d+)\s*\/\s*5/);
    const xm=v(r,C.xlnt).match(/(\d+)\s*a/i), raw=v(r,C.mnr);
    const j={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), created:new Date().toISOString(), status:'planerad',
      order:{ao, uppdrag:upp, oldRatio:m?m[1]+'/5':'', newType:m&&m[2]||'', newRatio:m?m[3]+'/5':'', xlnt:xm?+xm[1]:null, nyckel:v(r,C.nyc), anteckning:v(r,C.ant), matarnrRaw:raw},
      fore:{nat:'TN-C 4-ledare', ean, adress:v(r,C.adr), matarnr:stripNr(raw), ratio:m?m[1]+'/5':'', plint:v(r,C.pl), placering:v(r,C.plc)},
      byte:{safe:{}}, efter:{}, kontroll:{fore:{},efter:{},note:{fore:{},efter:{}}}, borda:{}};
    jobs.push(j); await dbPut('jobs',j); added++;
  }
  render();
  alert(`${added} nya uppdrag importerade.\n${done} redan utförda hoppades över.\n${dup} fanns redan i appen eller förekom två gånger i filen.`);
}

async function shareProtocol(j){

  const name=`trafobyte-${(j.fore.ean||'utan-ean').replace(/\W/g,'')}-${j.created.slice(0,10)}.html`;

/* ================= Foton ================= */
function stampPhoto(file,j){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const m=1600, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
      const txt=`${new Date().toLocaleString('sv-SE')}  ${j.fore.ean||''}`, fs=Math.max(16,Math.round(c.width/40));
      x.font=`${fs}px sans-serif`; x.fillStyle='rgba(0,0,0,.6)'; x.fillRect(0,c.height-fs*1.8,c.width,fs*1.8);
      x.fillStyle='#fff'; x.fillText(txt,fs*.6,c.height-fs*.6);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.72);
    };
    img.onerror=rej; img.src=url;
  });
}
async function loadPhotos(id){
  Object.values(photoUrls).forEach(u=>URL.revokeObjectURL(u)); photoUrls={};
  photoMeta=(await photosOf(id)).map(p=>{ photoUrls[p.id]=URL.createObjectURL(p.blob); return {id:p.id,step:p.step,t:p.t}; });
}

  if(a==='sharerow'){ const row=excelRow(j); try{ await navigator.share({text:row}); }catch(err){} return; }
  if(a==='clearplanned'){ const n=jobs.filter(x=>x.status==='planerad').length; if(!confirm(`Ta bort ${n} uppdrag som inte är påbörjade? Påbörjade och klara byten påverkas inte.`)) return;

  if(a==='finish'){ j.status=j.status==='klar'?'pågår':'klar'; save(j); return render(true); }
  if(a==='delete'){ const n=(await photosOf(j.id)).length, namn=j.fore.adress||j.fore.ean||'detta byte';
    const msg=j.status==='klar'?`Radera ${namn} och ${n} foton? Går inte att ångra. Har du skickat protokollet?`:`Radera ${namn}${n?` och ${n} foton`:''}? Går inte att ångra.`;
    if(!confirm(msg)) return;
    for(const p of await photosOf(j.id)) await dbDel('photos',p.id); await dbDel('jobs',j.id);
    jobs=jobs.filter(x=>x.id!==j.id); st={view:'list'}; render(); }
});
